<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 64 64"
  fill="none"
>
  <!-- Background -->
  <rect
    width="64"
    height="64"
    rx="15"
    fill="#111111"
  />

  <!-- White crosshair corners -->

  <!-- Top-left -->
  <path
    d="M8 20V8H20"
    stroke="white"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Top-right -->
  <path
    d="M44 8H56V20"
    stroke="white"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Bottom-left -->
  <path
    d="M8 44V56H20"
    stroke="white"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Bottom-right -->
  <path
    d="M56 44V56H44"
    stroke="white"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Smaller album -->
  <g transform="translate(32 32) scale(0.84) translate(-32 -32)">

    <rect
      x="13"
      y="19"
      width="30"
      height="30"
      rx="3"
      transform="rotate(-10 13 19)"
      fill="none"
      stroke="#A855F7"
      stroke-width="4"
    />

    <rect
      x="22"
      y="15"
      width="30"
      height="30"
      rx="3"
      transform="rotate(8 22 15)"
      fill="#A855F7"
    />

    <!-- Center label -->
    <circle
      cx="37"
      cy="30"
      r="7"
      fill="#111111"
    />

    <!-- Center hole -->
    <circle
      cx="37"
      cy="30"
      r="2"
      fill="white"
    />

  </g>
</svg>